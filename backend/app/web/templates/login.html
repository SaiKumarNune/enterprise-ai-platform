{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Sign in</h1>
  <p class="lede">Use your local password. Authorization is enforced by the API, not this page.</p>
  {% if error %}
  <p class="state error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/app/login" class="stack">
    <label>Email
      <input type="email" name="email" value="{{ email }}" required autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
